# SonarCloud configuration for a Maven project located in the demo/ subfolder.
# Replace the placeholders below with your actual SonarCloud organization and project key.
sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORG
sonar.host.url=https://sonarcloud.io
